<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGHRABY STORE</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #06152b url("background.jpg") center center / cover no-repeat fixed;
    color: #eef4ff;
    font: 18px/1.7 "Tahoma", "Segoe UI", Arial, sans-serif;
}
  body::before { content:""; position:fixed; inset:0; background:rgba(3,12,28,.28); pointer-events:none; z-index:0; }
  #wrap { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:28px 24px 40px; }
  #state { font-size:32px; font-weight:800; margin:10px 0 10px; text-shadow:0 2px 10px rgba(0,0,0,.35); }
  #det { font-size:18px; color:#c9d7e9; margin:0 0 8px; }
  #det b { color:#ffffff; font-weight:600; }
  #cache { font-size:16px; color:#aebed3; margin:0 0 18px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { position:relative; z-index:1; text-align:center; padding:16px 14px 18px;
           background:rgba(4,20,43,.92); border-bottom:1px solid #2c5278;
           box-shadow:0 4px 18px rgba(0,0,0,.22); }
  #brand img { width:50px; height:50px; margin-left:12px; border-radius:10px;
               vertical-align:middle; object-fit:cover; }
  #brand b { font-size:36px; font-weight:800; letter-spacing:.04em;
             color:#ffffff; vertical-align:middle; }
  #store-info { position:relative; z-index:1; max-width:900px; margin:20px auto 0; padding:0 24px; }
  .info-card { background:rgba(5,24,50,.88); border:1px solid rgba(94,143,190,.45);
               border-radius:16px; padding:18px 20px; box-shadow:0 8px 28px rgba(0,0,0,.25); }
  .store-title { font-size:24px; font-weight:800; color:#fff; margin-bottom:7px; }
  .address { font-size:18px; color:#d8e5f5; margin-bottom:12px; }
  .contacts { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .contact { display:inline-block; text-decoration:none; font-size:17px; font-weight:700;
             color:#fff; background:#0d3158; border:1px solid #315f8c;
             border-radius:10px; padding:9px 14px; }
  .contact:hover { background:#16466f; }
  @media (max-width:600px) {
    #brand b { font-size:29px; } #state { font-size:26px; } #det { font-size:16px; }
    .store-title { font-size:21px; } .address, .contact { font-size:16px; }
  }
</style>
</head>
<body>
<div id="brand"><img src="logo.png" alt="MAGHRABY STORE"><b>MAGHRABY STORE</b></div>
<div id="store-info">
  <div class="info-card">
    <div class="store-title">فرع سيدي بشر قبلي</div>
    <div class="address">أرض فضالي — أمام مكتبة الحمد</div>

  </div>
</div>
<div id="wrap">
  <div id="state">جاري فحص النظام...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "تم تحديد الوضع يدويًا: " + forced;
    } else if (!key) {
        why = "الجهاز ليس PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " — إصدار مناسب للوضع الأول";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " — إصدار مناسب للوضع الثاني";
    } else {
        why = key + " — لا يوجد وضع متوافق لهذا الإصدار";
    }
    detEl.innerHTML = "إصدار النظام <b>" + (key || "unknown") + "</b>"
        + " &middot; الحالة <b>" + (bug === "lapse" ? "الوضع الأول" : (bug === "poops" ? "الوضع الثاني" : "غير محدد")) + "</b> &middot; " + why;

    if (!bug) { setState("إصدار النظام غير مدعوم", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() { setState("جاري التحميل...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("يعمل بدون إنترنت -- من الذاكرة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("تم الحفظ", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تنزيل التحديث", true);
        waitForTap("التحديث جاهز -- اضغط X أو اضغط على الشاشة لإعادة التحميل",
                   function () { location.reload(); });
    } else {
        setCache("جاري فحص الذاكرة...");
        ac.addEventListener("downloading",
            function () { setCache("جاري الحفظ للاستخدام بدون إنترنت..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جارٍ الحفظ: " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cتم الحفظ للاستخدام بدون إنترنت", true);
            waitForTap("تم الحفظ لأول مرة — اضغط X أو المس الشاشة للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل التحديث", true);
            waitForTap("التحديث جاهز -- اضغط X أو اضغط على الشاشة لإعادة التحميل",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("تم الحفظ -- جاهز للعمل بدون إنترنت", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("الذاكرة غير صالحة");
            waitForTap("فشل الحفظ -- اضغط X أو اضغط على الشاشة للمتابعة", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("الذاكرة غير صالحة");
            waitForTap("الذاكرة غير صالحة — اضغط X أو المس الشاشة للتشغيل", go);
        }, false);
    }
})();
</script>
</body>
</html>
